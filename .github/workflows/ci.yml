name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'milestone/**'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Android and Web
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify generated Drift sources and schema snapshot
        run: |
          dart run build_runner build
          dart run drift_dev schema dump lib/src/infrastructure/persistence/local/app_database.dart drift_schemas/app_database_v1.json
          git diff --exit-code -- lib/src/infrastructure/persistence/local/app_database.g.dart drift_schemas/app_database_v1.json

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Web
        run: flutter build web

      - name: Build Android debug APK
        run: flutter build apk --debug
