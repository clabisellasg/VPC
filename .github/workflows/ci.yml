name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'milestone/**'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Android and Web
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify generated Drift sources and schema helpers
        run: |
          dart run build_runner build
          # drift_dev schema dump currently stalls in Dart's build-hook phase
          # on both Windows and GitHub-hosted Linux. build_runner verifies the
          # source-generated database, while schema generate verifies that the
          # committed JSON snapshots can regenerate their migration helpers.
          schema_version="$(sed -n 's/.*schemaVersion => \([0-9][0-9]*\).*/\1/p' lib/src/infrastructure/persistence/local/app_database.dart)"
          test -n "$schema_version"
          test -f "drift_schemas/drift_schema_v${schema_version}.json"
          dart run drift_dev schema generate drift_schemas test/generated_migrations
          git diff --exit-code -- lib/src/infrastructure/persistence/local/app_database.g.dart drift_schemas test/generated_migrations

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Web
        run: flutter build web

      - name: Build Android debug APK
        run: flutter build apk --debug
